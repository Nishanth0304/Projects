<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 120px;
  height: 120px;
  background: steelblue;
  color: white;
  margin: 20px;
  display: flex;
  justify-content: center;
  align-items: center;

  transition: 0.5s;
}

/* Different transform effects */
.translate:hover {
  transform: translateX(100px);
}

.rotate:hover {
  transform: rotate(45deg);
}

.scale:hover {
  transform: scale(1.3);
}

.skew:hover {
  transform: skew(20deg);
}

.multiple:hover {
  transform: translateX(50px) rotate(20deg) scale(1.2);
}
</style>
</head>
<body>

<div class="box translate">Translate</div><br>
<div class="box rotate">Rotate</div><br>
<div class="box scale">Scale</div><br>
<div class="box skew">Skew</div><br>
<div class="box multiple">Multiple</div>

</body>
</html>
