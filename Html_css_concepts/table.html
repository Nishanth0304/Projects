<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Employee Management Table</h1>
    <table border="">
        <tr>
            <th colspan="5">Company Employee Details</th>
        </tr>
        <tr>
            <th rowspan="2">Employee ID</th>
            <th rowspan="2">Employee Name</th>
            <th colspan="2">Department</th>
            <th rowspan="2">Salary</th>

        </tr>
        <tr>
            <th>Department Name</th>
            <th>Team</th>  
        </tr>
        <tr>
            <td>101</td>
            <td>John Smith</td>
            <td rowspan="2">Engineering</td>
            <td>Frontend</td>
            <td>$5000</td>
        </tr>

        <tr>
            <td>102</td>
            <td>David Lee</td>
            <td>Backend</td>
            <td>$5500</td>
        </tr>

        <tr>
            <td>103</td>
            <td>Sarah Johnson</td>
            <td colspan="2">Human resources</td>
            <td>$4500</td>
        </tr>
        
        <tr>
            <td colspan="4" align="right"><b>Total Employees</b></td>
            <td><b>3</b></td>
        </tr>
    </table>
</body>
</html>
