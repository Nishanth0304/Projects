<!DOCTYPE html>
<html>
<head>
    <title>Example of Basic HTML Webpage Layout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body {
   font-family: Arial, sans-serif;
   background-color: #f2f2f2;
   margin: 0;
   padding: 0;
}
header {
   background-color: red;
   color: #fff;
   padding: 20px;
   text-align: center;
}
nav{
  background-color: aqua;
   color: #fff;
   padding: 20px;
   text-align: center;   
}
a:visited{
    color: black;
}
main {
   display: flex; /* Use flexbox for layout */
   padding: 20px;
}
.content {
   flex: 2; /* 2/3 of the main content area */
}
.sidebar {
flex: 1; /* 1/3 of the main content area */
background-color: pink;
padding: 100px;
margin-left: 20px;
text-align: center;
}
section {
    background-color: #f3e30a;
    padding: 50px;
    margin-bottom: 20px;
    text-align: center;
    height: 100px;
}
article{
    background-color: orange;
    padding: 20px;
    margin-bottom: 20px;
    text-align: center;
    height: 100px;
}

footer {
    background-color: #333;
    color: #fff;
    padding: 30px 30px;
    text-align: center;
    height: 100px;
}
</style>
</head>
<body>
  <header>
     <h1>Header</h1>
   </header><br>

   <nav>
          <a href="">Navigation</a>
     </nav>

<main>
   <div class="content">
   <section>
      <h2>Section</h2>
      
   </section>
   <article>
      <h2>Article</h2>
     
   </article>
   </div>

<aside class="sidebar">
   <h2>Aside</h2>
   
</aside>
</main>

<footer>
      <p>Footer</p>
</footer>
</body>
</html>
