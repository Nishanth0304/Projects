<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML5 Validation Form</title>
</head>
<body>

    <form action="strucure.html">
        <fieldset>
            <legend>Registration Form</legend>
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required minlength="3" pattern="[A-Za-z ]+"><br><br>
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required minlength="8" maxlength="20"><br><br>
                 <label for="gender">Gender:</label>
                <select id="gender" name="gender" required>
                    <option value="">-- Select gender --</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                </select><br><br>
                <label for="age">Age (18 - 99):</label>
                <input type="number" id="age" name="age" min="18" max="99" required><br><br>

        </fieldset>
        <fieldset>
            <legend>Educational Information</legend>
            <label for="degree">Highest Qualification:</label>
                <select id="degree" name="degree" required>
                    <option value="">-- Select Degree --</option>
                    <option value="highschool">High School</option>
                    <option value="diploma">Diploma</option>
                    <option value="bachelors">Bachelor's Degree</option>
                    <option value="masters">Master's Degree</option>
                    <option value="phd">Ph.D.</option>
                </select><br><br>
            <label for="institution">Institution/University Name:</label>
                <input type="text" id="institution" name="institution" required minlength="3"><br><br>
            
                <label for="grad-year">Year of Graduation (1950 - 2030):</label>
                <input type="number" id="grad-year" name="grad-year" min="1950" max="2030" required placeholder="YYYY"><br><br>
                <label for="grade">Percentage / GPA:</label>
                <input type="number" id="grade" name="grade" min="0" max="100" step="0.01" required placeholder="e.g., 85.5 or 3.8"><br><br>
            <button type="submit">Submit</button>
        </fieldset>
    </form>
</body>
</html>
